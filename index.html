<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Pomodoro Timer</h1>
      <p class="session-counter">Sessions completed: <span id="session-count">0</span></p>
    </header>

    <main class="timer-card">
      <div class="mode-label" id="mode-label">Work</div>

      <div class="timer-ring">
        <div class="progress-ring" id="progress-ring"></div>
        <div class="timer-face" id="timer-display">25:00</div>
        <div class="phase-label" id="phase-label">Work</div>
      </div>

      <div class="controls">
        <button id="start-button" type="button">Start</button>
        <button id="pause-button" type="button" disabled>Pause</button>
        <button id="resume-button" type="button" disabled>Resume</button>
        <button id="reset-button" type="button" disabled>Reset</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
